<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Brak połączenia — docvue</title>
    <meta name="theme-color" content="#fcf9f8" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fcf9f8;
        color: #271816;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: #6f5957;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.875rem;
        line-height: 1.6;
        color: #6f5957;
        margin: 0 0 24px;
      }
      .brand {
        font-weight: 700;
        letter-spacing: -0.02em;
        font-size: 1.1rem;
        margin-bottom: 24px;
      }
      .brand span {
        color: #6f5957;
      }
      button {
        min-height: 44px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: #6f5957;
        color: #fff;
        font-size: 0.9375rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #5c4846;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg
          width="44"
          height="44"
          viewBox="0 0 100 102"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="M 85 35 C 85 35, 65 60, 45 60 C 25 60, 5 35, 5 35 C 5 35, 25 10, 45 10 C 65 10, 85 35, 85 35 Z"
            fill="#fcf9f8"
          />
          <g transform="translate(45, 35)">
            <mask id="v">
              <rect x="-22" y="-22" width="44" height="44" fill="white" />
              <path
                d="M -9 -7 L 0 9 L 14 -14"
                stroke="black"
                stroke-width="7"
                stroke-linecap="round"
                stroke-linejoin="round"
                fill="none"
              />
            </mask>
            <circle cx="0" cy="0" r="20" fill="#271816" mask="url(#v)" />
          </g>
          <path
            d="M 85 35 C 85 35, 65 60, 45 60 C 25 60, 5 35, 5 35 C 5 35, 25 10, 45 10 C 65 10, 85 35, 85 35 Z"
            stroke="#271816"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
          />
        </svg>
      </div>
      <div class="brand">doc<span>vue</span></div>
      <h1>Brak połączenia z internetem</h1>
      <p>
        Sprawdź połączenie z siecią i spróbuj ponownie. Twoje zapisane dane pozostają bezpieczne.
      </p>
      <button type="button" onclick="location.reload()">Spróbuj ponownie</button>
    </main>
  </body>
</html>
