  <circle cx="612" cy="505" r="26" fill="#9b7771"/>
  <circle cx="388" cy="505" r="11" fill="#3b2d2b"/>
  <circle cx="612" cy="505" r="11" fill="#3b2d2b"/>
  <circle cx="396" cy="496" r="6" fill="#fffaf8" opacity="0.9"/>
